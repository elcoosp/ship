[package]
name = "ship"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"

[lib]
name = "ship"
path = "src/lib.rs"

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
globset = "0.4.21"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
anyhow = "1.0.104"
comfy-table = "8.0.1"
pretty-console = { git = "https://github.com/elcoosp/pretty-console", version = "2.0.0" }
unicode-width = "0.2.3"
indicatif = "0.18.6"
gix = { version = "0.90", default-features = false, features = ["sha1", "parallel", "revision"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rayon = "1.12"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27"
