[package]
name = "ship"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "ship"
path = "src/lib.rs"

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
globset = "0.4"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
notify = "8.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.6"
anyhow = "1.0.104"
comfy-table = "8.0.1"
pretty-console = { git = "https://github.com/elcoosp/pretty-console", version = "2.0.0" }
unicode-width = "0.2.3"
indicatif = "0.18.6"
crossterm = "0.29.0"
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.8"
